[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xmcam-fs"
version = "0.1.0"
description = "Mount a Xiongmai / iCSee / XMeye IP camera as a FUSE filesystem and browse its recordings as files (MP4 or raw), sshfs-style. No cloud."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "theundefined", email = "undefine@aramin.net" }]
keywords = [
    "xiongmai", "xm", "icsee", "xmeye", "dvrip", "onvif", "fuse", "pyfuse3",
    "filesystem", "ip-camera", "cctv", "nvr", "recordings", "mount",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Video",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "xmcam-py>=0.3.0",
    "pyfuse3>=3.2.0",
    "trio>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.3.0",
    "black>=24.0.0",
    "mypy>=1.9.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/theundefined/xmcam-fs"
Repository = "https://github.com/theundefined/xmcam-fs"
Issues = "https://github.com/theundefined/xmcam-fs/issues"

[project.scripts]
xmcam-fs = "xmcamfs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xmcamfs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
ignore_missing_imports = true
